name: Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        working-directory: lean-phase1
        run: lake exe cache get

      - name: Build
        working-directory: lean-phase1
        run: lake build

      - name: Check for sorry
        working-directory: lean-phase1
        run: |
          if grep -rn "sorry\|admit" PseudoRiemannian/; then
            echo "sorry found, failing"
            exit 1
          fi
          echo "no sorry"
